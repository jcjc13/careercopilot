# Shared experiment config. Changing `llm`, `retrieval`, `verifier` or `tailoring`
# invalidates cached runs -- bump `run_name` when you do.
run_name: v2
seed: 469

data:
  hf_dataset: cnamuangtoun/resume-job-description-fit
  hf_split: train          # split to sample pairs from
  per_label: 12            # pairs per fit level (Good / Potential / No Fit) for E3
  out_dir: data/processed
  sample_pairs: data/sample/pairs.jsonl   # 3 hand-written pairs; used by --sample and the demo
  verifier_train_resumes: 300             # OTHER resumes used only to build the fine-tuning set

# Models are reached through any OpenAI-compatible API. Defaults follow the class labs:
# Groq (free tier), a weaker/faster model inside the pipeline and a stronger one as judge.
# Key: GROQ_API_KEY in .env. For a local model via Ollama (Topic 5), use
#   base_url: http://localhost:11434/v1, api_key_env: OLLAMA_API_KEY (any value), model: qwen3:4b
llm:                       # the model INSIDE the pipeline (tailoring, requirements, LLM verifier)
  model: openai/gpt-oss-20b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.0
  reasoning_effort: low    # gpt-oss are reasoning models; hidden reasoning tokens count as output
  price_in: 0.10           # USD per 1M tokens, for cost estimates -- check current Groq pricing
  price_out: 0.50

eval_judge:                # a STRONGER, different model used only for evaluation (E3)
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.0
  reasoning_effort: low
  price_in: 0.15
  price_out: 0.75

drafter:                   # a DIFFERENT model family that drafts the hard E2 test set (make_hard_claims.py)
  model: qwen/qwen3.8-27b  # Groq has no qwen3-32b; reasoning off so no <think> text is produced
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.3
  reasoning_effort: none
  price_in: 0.0
  price_out: 0.0

retrieval:
  method: hybrid             # tfidf | bm25 | embedding | hybrid  (set to the E1 winner before E3)
  top_k: 3
  contextual: false        # prepend each bullet's role/company line before indexing (contextual RAG)
  embedding_model: sentence-transformers/all-MiniLM-L6-v2   # the class labs' model; try BAAI/bge-small-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2     # used by hybrid; falls back to rank fusion if missing

verifier:
  method: finetuned_nli    # rule | nli | finetuned | finetuned_nli | llm  (E2 run v2 winner: best score-based model on both sets)
  nli_model: cross-encoder/nli-deberta-v3-small
  # thresholds below: run v2, tuned on the silver validation set (run_e2_verifiers.py, default --tune silver)
  nli_threshold: 0.2
  finetuned_path: models/verifier                 # fine-tuned bert-base-cased
  finetuned_threshold: 0.9
  finetuned_nli_path: models/verifier-nli-ft      # the NLI model above, fine-tuned on our silver data
  finetuned_nli_threshold: 0.7

finetune:                  # Topic 3 recipe (HF Trainer), see scripts/train_verifier.py
  base_model: google-bert/bert-base-cased
  epochs: 3
  learning_rate: 2.0e-5
  batch_size: 16
  weight_decay: 0.01
  max_length: 256

tailoring:
  n_requirements: 8
  max_bullets: 10
  max_regen: 2             # regeneration attempts per unsupported line = the loop's step budget (C, D)
  claim_split: llm         # llm | line   (line = treat each output line as one claim; cheaper)

paths:
  runs_dir: runs
  labels_dir: data/labels
  models_dir: models
  verifier_data: data/verifier       # silver fine-tuning set (make_verifier_train.py)
  skills_vocab: data/skills.txt
